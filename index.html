<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Email Sender</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success-bg: #ecfdf5;
      --success-text: #047857;
      --error-bg: #fef2f2;
      --error-text: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Khmer", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 50%, #dbeafe 100%);
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
      overflow: hidden;
    }

    .card-header {
      padding: 28px 32px 24px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
    }

    .card-header .icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .card-header h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .card-header p { margin: 6px 0 0; font-size: 14px; opacity: 0.85; }

    .card-body { padding: 28px 32px 32px; }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .input-wrap { position: relative; }

    .input-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--muted);
      pointer-events: none;
    }

    input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      font-size: 15px;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input::placeholder { color: #94a3b8; }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    button[type="submit"] {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 20px;
      margin-top: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }

    button[type="submit"]:hover:not(:disabled) { background: var(--primary-dark); }
    button[type="submit"]:active:not(:disabled) { transform: scale(0.99); }
    button[type="submit"]:disabled { opacity: 0.7; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    button.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .banner {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
    }
    .banner.show { display: block; }
    .banner.success { background: var(--success-bg); color: var(--success-text); }
    .banner.error { background: var(--error-bg); color: var(--error-text); }

    details {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    summary {
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    pre {
      margin: 10px 0 0;
      padding: 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #334155;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 180px;
      overflow: auto;
    }

    @media (max-width: 480px) {
      .card-header, .card-body { padding-left: 22px; padding-right: 22px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <path d="m3 7 9 6 9-6"/>
        </svg>
      </div>
      <h1>Send Customer Email</h1>
      <p>Enter the customer details below.</p>
    </div>

    <div class="card-body">
      <form id="form" novalidate>
        <div class="field">
          <label for="customerName">Customer Name</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
            </svg>
            <input type="text" id="customerName" placeholder="Enter customer name" autocomplete="off">
          </div>
        </div>

        `
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m3 7 9 6 9-6"/>
            </svg>
            <input type="email" id="email" placeholder="name@example.com" autocomplete="off">
          </div>
        </div>

        <button type="submit" id="submitBtn">
          <span class="spinner"></span>
          <span id="btnText">Submit</span>
        </button>
      </form>

      <div id="banner" class="banner" role="status"></div>

      <details>
        <summary>Technical response</summary>
        <pre id="result">Waiting...</pre>
      </details>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = 'https://defaultcfd77ecc8353402cb1308ec2aa6a80.62.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/24/workflows/fd75513061fa43f0b64cbd14c1b71331/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=UlZlJD5PXyvOLuwIVCfQ5cwM0J9fmD9E10DV4wNwj3c';

    // Static values for testing - change these as needed
    const STATIC_DATA = {
      subject: "Test email from webhook",
      message: "This is a test message."
    };

    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const result = document.getElementById('result');
    const banner = document.getElementById('banner');

    function showBanner(type, message) {
      banner.className = 'banner show ' + type;
      banner.textContent = message;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const customerName = document.getElementById('customerName').value.trim();
      const email = document.getElementById('email').value.trim();

      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        showBanner('error', 'Please enter a valid email address.');
        return;
      }

      const payload = {
        ...STATIC_DATA,
        customerName: customerName,
        email: email,
        password: customerName + "P@s$w0rd123",
      };

      submitBtn.disabled = true;
      submitBtn.classList.add('loading');
      btnText.textContent = 'Sending...';
      banner.className = 'banner';
      result.textContent = 'Sending...';

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const text = await response.text();
        result.textContent = `Status: ${response.status}\n\n${text}`;

        if (response.ok) {
          showBanner('success', 'Email sent successfully!');
          form.reset();
        } else {
          showBanner('error', `Request failed (status ${response.status}).`);
        }
      } catch (err) {
        result.textContent = 'Error: ' + err.message;
        showBanner('error', 'Failed to send: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        btnText.textContent = 'Send Email';
      }
    });
  </script>
</body>
</html>
